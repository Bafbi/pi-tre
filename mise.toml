monorepo_root = true

[monorepo]
config_roots = ["extensions/*", "packages/*"]
lockfile = true

[tools]
node = "25"
pnpm = "latest"

[env]
NODE_ENV = "development"

# Model for the default LLM-backed test. This is not a secret. Override it in
# mise.local.toml or the shell when a different provider is needed.
PI_TEST_MODEL = "opencode-go/mimo-v2.5"

[deps.pnpm]
auto = true

[shell_alias]
"biome" = "pnpm exec biome"

[task_templates."ext:test"]
description = "Run tests for this extension"
depends = [":typecheck", "//:lint"]
run = "bash ../../scripts/run-vitest.sh"

[task_templates."ext:lint"]
description = "Run Biome checks for this extension"
depends = ["//:format"]
run = "pnpm exec biome check ."

[task_templates."ext:typecheck"]
description = "Type-check this extension"
depends = ["//:format"]
run = "pnpm exec tsc -p tsconfig.json --noEmit"

[task_templates."ext:check"]
description = "Run lint + typecheck + tests for this extension"
depends = [":lint", ":typecheck", ":test"]

[tasks.format]
description = "Format repository with Biome"
run = "pnpm run format"

[tasks.lint]
description = "Run Biome lint checks"
depends = ["//:format"]
run = "pnpm run lint"

[tasks.test]
description = "Run all extension tests"
run = "bash scripts/run-vitest.sh"

[tasks.typecheck]
description = "Type-check all workspace packages"
run = "pnpm -r run typecheck"

[tasks.check]
description = "Run lint + typecheck + tests"
run = { tasks = ["//:lint", "//:typecheck", "//:test"] }
