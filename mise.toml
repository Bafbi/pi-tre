[tools]
node = "25"
pnpm = "latest"

[env]
NODE_ENV = "development"

[deps.pnpm]
auto = true

[tasks.install]
description = "Install workspace dependencies"
run = "pnpm run install"

[tasks.lint]
description = "Run Biome lint checks"
depends = ["format"]
run = "pnpm run lint"

[tasks.format]
description = "Format repository with Biome"
run = "pnpm run format"

[tasks.typecheck]
description = "Type-check all workspace packages"
run = "pnpm run typecheck"

[tasks.test]
description = "Run test suite"
depends = ["lint", "typecheck"]
run = "pnpm run test"

[tasks.check]
description = "Run lint + typecheck + tests"
run = { tasks = ["lint", "typecheck", "test"] }
