[tasks.lint]
extends = "ext:lint"

[tasks.test]
extends = "ext:test"

[tasks.test-external]
extends = "ext:test-external"

[tasks.typecheck]
extends = "ext:typecheck"
# pi-subagent is a workspace dependency. Its sources are part of this task's
# inputs so a change there invalidates this typecheck. A `depends` edge alone
# does not persist across separate mise invocations.
sources = [
	"src/**/*.ts",
	"tsconfig.json",
	"{{ vars.monorepo }}/tsconfig.base.json",
	"{{ vars.monorepo }}/packages/pi-subagent/src/**/*.ts",
]

[tasks.typecheck-strict]
extends = "ext:typecheck-strict"

[tasks.type-aware]
extends = "ext:type-aware"
sources = [
	"src/**/*.ts",
	"test/**/*.ts",
	"{{ vars.monorepo }}/biome.json",
	"{{ vars.monorepo }}/packages/pi-subagent/src/**/*.ts",
]

[tasks.ci]
extends = "ext:ci"

[tasks.check]
extends = "ext:check"

[tasks.generate-schema]
description = "Regenerate the committed JSON config schema"
run = "node scripts/generate-schema.ts"
